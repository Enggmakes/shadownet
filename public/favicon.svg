<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="topPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#55ff99"/>
      <stop offset="100%" stop-color="#00dd55"/>
    </linearGradient>
    <linearGradient id="midPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e664"/>
      <stop offset="100%" stop-color="#00993d"/>
    </linearGradient>
    <linearGradient id="botPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b347"/>
      <stop offset="100%" stop-color="#006622"/>
    </linearGradient>
    <linearGradient id="edgeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#009938"/>
      <stop offset="100%" stop-color="#004419"/>
    </linearGradient>
    <linearGradient id="edgeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b845"/>
      <stop offset="100%" stop-color="#005520"/>
    </linearGradient>
  </defs>

  <!-- Dark cyber rounded container with neon border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#00ff66" stroke-width="1.8" stroke-opacity="0.45"/>

  <!-- Ambient floor glow -->
  <ellipse cx="32" cy="53" rx="20" ry="6" fill="#00ff66" fill-opacity="0.25"/>

  <!-- BOTTOM LAYER (Layer 3) -->
  <g id="layer3">
    <path d="M 14,45 L 32,54 L 32,58 L 14,49 Z" fill="url(#edgeLeft)"/>
    <path d="M 50,45 L 32,54 L 32,58 L 50,49 Z" fill="url(#edgeRight)"/>
    <polygon points="32,37 50,45 32,54 14,45" fill="url(#botPlate)"/>
    <polygon points="32,37 50,45 32,54 14,45" fill="none" stroke="#00ff66" stroke-width="1.1" stroke-opacity="0.6"/>
  </g>

  <!-- MIDDLE LAYER (Layer 2) -->
  <g id="layer2">
    <path d="M 14,31 L 32,40 L 32,44 L 14,35 Z" fill="url(#edgeLeft)"/>
    <path d="M 50,31 L 32,40 L 32,44 L 50,35 Z" fill="url(#edgeRight)"/>
    <polygon points="32,23 50,31 32,40 14,31" fill="url(#midPlate)"/>
    <polygon points="32,23 50,31 32,40 14,31" fill="none" stroke="#55ff99" stroke-width="1.2" stroke-opacity="0.8"/>
  </g>

  <!-- TOP LAYER (Layer 1) -->
  <g id="layer1">
    <path d="M 14,17 L 32,26 L 32,30 L 14,21 Z" fill="url(#edgeLeft)"/>
    <path d="M 50,17 L 32,26 L 32,30 L 50,21 Z" fill="url(#edgeRight)"/>
    <polygon points="32,9 50,17 32,26 14,17" fill="url(#topPlate)"/>
    <polygon points="32,9 50,17 32,26 14,17" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-opacity="0.95"/>
    
    <!-- Cyber Terminal Core Motif -->
    <polygon points="32,13.5 42,17.5 32,21.5 22,17.5" fill="#040c07" fill-opacity="0.65"/>
    <polyline points="28,15.5 32,17.5 28,19.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="19.5" x2="36.5" y2="19.5" stroke="#55ff99" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
